 mng_baimujiaoji_title:0 "百木交集"
 mng_baimujiaoji_desc:0 "明时，镇江所产船具几近天下大半，各地商人到此贩售木材，有“百木交集”之称。温带与寒带地区出产的木材是建造大型舰船的必须，为了建造庞大的舰队，我们首先要控制船具的来源。"

 mng_guangzaobaochuan_title:0 "广造宝船"
 mng_guangzaobaochuan_desc:0 "自永乐后，明对外界的探索逐渐趋于停滞，海禁政策更加重了这种趋势。随着外界商人与财富的到来，我们意识到了重启海洋事业的重要性。重建宝船舰队，将大明的权威与恩泽布施到遥远的海洋！"
 
 mng_zhaofengjiugang_title:0 "诏封旧港"
 mng_zhaofengjiugang_desc:0 "南洋的商人们带来了一封求援信，称满者伯夷王擅自进攻了三佛齐王，连带着威胁到了我们在旧港的贸易站，以及南洋商路的安全。商人们已经拥立梁道成为旧港总督，希望我们用诏书和舰队保护他们的安全。这或许可以作为我们插手南洋事务的机会。"
 
 mng_gujiaopanyan_title:0 "孤峤蟠烟"
 mng_gujiaopanyan_desc:0 "“孤峤蟠烟，层涛蜕月”，这是宋人王沂孙词句，描绘的是龙涎香的产地。龙涎香又名龙腹香，产自大洋中抹香鲸的腹内。宋时已有专门的捕鲸船猎捕抹香鲸，取香制饼为篆字香，一饼或达万金。一支宝船队伍向我们的皇帝报告，称在遥远的南大洋发现了大量的鲸群，并奉上了一张海图，上面描绘着未知的海岸线。皇帝对这片海岸线很感兴趣。"
 
 mng_wuyuetidu_title:0 "吴越提督"
 mng_wuyuetidu_desc:0 "吴越一带人乘船出行，多善水性，自古来便诞生过无数著名的水师提督。为了组建大明的海军，我们当命地方官从吴越一带拔擢优秀的人才，让他们指挥我们的舰队。"
 
 mng_linlangzongmu_title:0 "琳琅总目"
 mng_linlangzongmu_desc:0 "林林总总，珠陈玉横，无数的宝船为我们带来了来自南洋的财富。无论是泉州、广州还是旧港，到处都是来自四海的奇珍异宝，魏紫姚黄，珊瑚玉树，灵鼍蚌胎，无所不有。"
 
 mng_datongtieye_title:0 "大通铁冶"
 mng_datongtieye_desc:0 "太祖在时，点平阳、大通、潞安、太原等诸官营铁冶所，使山西一时成为大明最重要的铁矿来源地。其中，大通铁冶所冶云子铁，为晋中最佳。随着火器的发展，我们更应进一步开发这里，以生产稳定、大量的铁。"
 
 mng_xishuqiqianbu_title:0 "恩许驻地"
 mng_xishuqiqianbu_desc:0 "又有一批西方人来到了澳门，这些人和此前到来的西方人相比装束迥异，举止彬彬有礼。他们似乎对大明的知识很感兴趣，并表示他们也带来了他们的知识和书籍，内容关于科学、宗教和艺术，一共有七千多部。他们提议将澳门划出一块作为他们的驻留地，这样就可以为皇帝带来更多的知识。"
 
 mng_folangji_title:0 "佛郎机人"
 mng_folangji_desc:0 "广州总督报告，海上来了一群装束奇异的异邦人，他们宣称自己是从遥远大洋的另一端来的，并表示自己对东方的一些奢侈商品非常感兴趣，请求皇帝赐给他们澳门这块驻地供他们暂留。我们应当看看这些人能给我们带来什么。"
 
 mng_xixuedongjian_title:0 "西儒拜官"
 mng_xixuedongjian_desc:0 "西方来的学者被我们称为西儒，他们已经获准在我们的内廷中任职，为我们的治理提供西洋知识的辅佐。随着东西交往逐渐密集，有许多学士已经意识到西洋知识的先进性，提议建立“西学”作为学识一目，专门接纳和吸收西洋知识。"
 
 mng_tunmenchongtu_title:0 "屯门冲突"
 mng_tunmenchongtu_desc:0 "西洋人不总是热爱知识和和平，事实上大明与西方的初期接触并不算愉快，佛郎机人不仅不对皇帝恩准的驻扎地心怀感激，还要求强占澳门作为贸易站。在得到了拒绝的答复之后，佛郎机人便去往了广州海岸的屯门岛，在上面修建了工事和炮台，不时轰击我们的商船。是可忍熟不可忍，水师提督汪鋐已经领命，欲清剿佛郎机人，这就是屯门海战的起因。屯门之后佛郎机人趁风暴仓皇逃离广州海岸，随后不久的西草湾海战中，佛郎机人损失惨重，不得不议和。"
 
 mng_dongnankouhuan_title:0 "东南寇患"
 mng_dongnankouhuan_desc:0 "两度落败之后，佛郎机人并没有放弃对东南沿海的野心，他们转而找到了东瀛小邦日本，与其进行了密谋，支持倭寇劫掠大明沿岸。明东南沿海一直饱受流寇之患，现在他们有了佛郎机人的支持，愈发变本加厉、不知畏惧。进来研造夷船取得了许多收获，必可用于东海荡寇之事，另凤阳人戚将军继光已领命清剿倭寇，若能取胜，则佛郎机匪患亦可平矣。"
 
 mng_nanyangxuanwei_title:0 "南洋宣慰"
 mng_nanyangxuanwei_desc:0 "在南洋有无数大大小小的土人番邦。在很长的一段时间里，这些番邦只是偶尔遣使朝贡，或诏书不达，或贡使不达，海路修远，无可掌握。现在，大明已经拥有了数支无比强大的舰队，它们将成为明在南洋的海上堡垒，拱卫辽阔的海域，威服野蛮的海族。日月所照，海流所至，皆属我大明疆土。"
 
 mng_shenjitiechong_title:0 "神机武备"
 mng_shenjitiechong_desc:0 "永乐帝提点神机营，以神机铁炮在前，骑兵部署于军团中央，以此战法五伐蒙古，无一不克。在确保了稳定的钢铁产出后，我们应当考虑将火器拓展到三军之中，组建一支火枪部队，同时研习铁炮的制法，并讨论围城战术和防守策略的革新。"
 
 mng_tiepaomengchong_title:0 "铁炮艨艟"
 mng_tiepaomengchong_desc:0 "郑和的宝船舰队就已经安置有铁炮，多以碗口炮为主，口径较小，威力也一般。同佛郎机人的交流使我们获取了他们更为先进的铁炮，通过研究他们的铁炮，我们制成了红夷大炮，并将其安置于宝船之上，采用侧翼开火的战术，增强了宝船的战斗力。"

 mng_taiwan_title:0 "经略琉球"
 mng_taiwan_desc:0 "在与西方人数次交锋之中，我们意识到了控制岛屿对于掌控海洋的重要性。此前东海的琉球诸屿一直被视为中原王朝的势力范围，当地土人极其野蛮而不服王化，我们一直希望采取温和的策略对他们进行同化。然而，佛郎机人的到来使得温和、缓慢的策略不再实用，我们不能允许佛郎机贼寇占据这座岛屿，那将威胁到东南沿海的安全。"

 LDH_ciallo_mng_event_namespace.1.t:0 "镇江府木材采买"
 LDH_ciallo_mng_event_namespace.1.d:0 "镇江府历来是明的船具大港，各地商人皆向此运送和贩售木材。由于对海外探索的需求与日俱增，朝廷决定特派官员以高价大量采购商人们手中的木料，以备研造宝船之用。一时间，大量商人前往关外买进当地木材。"
 LDH_ciallo_mng_event_namespace.1trans:0 "广集百木，供宝船用"
 
 LDH_ciallo_mng_event_namespace.2.t:0 "海外奇香"
 LDH_ciallo_mng_event_namespace.2.d:0 "龙涎香，又名龙腹香，最初是由汉朝人制作的。交州一带的渔民从海上捞回了一种漂浮的灰色团状物，初觉奇腥难忍，弃置几日待干燥后，复顿觉奇香无比，呈给圣上赐名龙涎香。唐宋时人出海捕鲸，取其腹内龙涎香制香饼，名篆字香，权贵世胄甚喜爱之。现在，对南洋的开拓使得龙涎香有了稳定的产出来源，广州商行整日挤满了求购龙涎香饼的商人。"
 LDH_ciallo_mng_event_namespace.2trans:0 "奇香盖世"
 
 LDH_ciallo_mng_event_namespace.3.t:0 "大明的铁冶所"
 LDH_ciallo_mng_event_namespace.3.d:0 "夫火器之用，无间古今，无间攻守，其种实多。如发熕，即神机、大将军、二将军、三将军，威猛无敌，破敌可成血路，攻城可使立碎，古惟铜铁铸成者，自广东叶军门始以熟铁打造，较铸者远矣。"
 LDH_ciallo_mng_event_namespace.3trans:0 "可充神机营武备"
 
 LDH_ciallo_mng_event_namespace.4.t:0 "东海之主"
 LDH_ciallo_mng_event_namespace.4.d:0 "自屯门、西草湾连胜后，佛郎机人仓皇逃回马六甲，然而其贼心不死，又前往东洋支持倭寇，一时间使我东南沿岸匪盗横行。戚将军继光领命抗倭，十余年间荡平东洋倭寇，令佛郎机流人望而生畏，不敢复进犯。"
 LDH_ciallo_mng_event_namespace.4trans:0 "天无二日，土无二王"
 
 LDH_ciallo_mng_event_namespace.5.t:0 "东方的失利"
 LDH_ciallo_mng_event_namespace.5.d:0 "马六甲总督回报，我们的舰队被明人尽数歼灭，得到我们支持的海盗团队也已偃旗息鼓、不敢复出。看来我们在东方的努力已经彻底破产了。"
 LDH_ciallo_mng_event_namespace.5trans:0 "我们只得吞下失败的苦果"
 
 LDH_ciallo_mng_event_namespace.6.t:0 "佛郎机人？"
 LDH_ciallo_mng_event_namespace.6.d:0 "广州的商人们最近谈论着一群远道而来的客人，他们自称是来自遥远大洋的另一端，乘船来到这里是为了做生意。一些学者考察了前人的典籍，认为这些人很可能是所谓的佛郎机人。让我们看看这些人能给我们带来什么。"
 LDH_ciallo_mng_event_namespace.6trans:0 "这些红发蛮夷来自哪里？"
 
 LDH_ciallo_mng_event_namespace.7.t:0 "西学东渐"
 LDH_ciallo_mng_event_namespace.7.d:0 "西洋儒士给我们带来的书籍中记载着无数宝贵的知识，极大地拓宽了我们的眼界。有许多学士认为，我们应当考虑将这些学问纳入我们的统治方法、生产方法和军事战术当中，师夷长技以制夷。"
 LDH_ciallo_mng_event_namespace.7trans:0 "以彼之长，补我之短"
 
 LDH_ciallo_mng_event_namespace.8.t:0 "琉球港口"
 LDH_ciallo_mng_event_namespace.8.d:0 "琉球岛历来是我中原王朝的势力范围，然而与佛郎机人的交锋使我们意识到了这座小岛的战略价值。我们的拓业队登上了这座充满了高山和瘴气的小岛，在抵抗了数次当地野人对我们伟大事业的野蛮破坏之后，我们终于在岛屿南部建立了一个据点。意想不到的是，这里有许多优质的陶土。"
 LDH_ciallo_mng_event_namespace.8trans:0 "陶土制成瓷器，野人赶进山中"
 
 LDH_ciallo_mng_event_namespace.9.t:0 "南洋宣慰"
 LDH_ciallo_mng_event_namespace.9.d:0 "无论是广州、交州，还是旧港、波尼，到处都能看见我们庞大的宝船。船上载满了各种奇珍异宝，象征着大明的财富；船舷安置着成排的巨型铁炮，象征着大明的武功。如果有任何人胆敢挑战大明的权威，我们的舰队就会把他们的国家和臣民轰成血肉齑粉。日月所照之地，皆是我大明疆土。"
 LDH_ciallo_mng_event_namespace.9trans:0 "日月高悬，普照南洋"

 mng_chuanjudecaifu:0 "宝船木料"
 mng_xunxiangdecaifu:0 "篆字香饼"
 mng_tikuangdekaifa:0 "官营铁冶所"
 
 #trigger
 LDH_ciallo_mng_trigger_1_tt:0 ""
 
 
 #event insight
 LDH_ciallo_mng_event_insight_1_tt:0 "\n §G事件前瞻§! ：朝廷派遣出特使，愿意以高价收购商人们手中的木材。这会导致船具的价格升高。"
 LDH_ciallo_mng_event_insight_2_tt:0 "\n §G事件前瞻§! ：南洋捕鲸船带回来的龙腹香在广州市场上受到权贵们的热烈追捧，这将导致熏香的价格急剧升高。"
 LDH_ciallo_mng_event_insight_3_tt:0 "\n §G事件前瞻§! ：各官营铁冶所的成立让我们的钢铁产量迅速增加，然而相比于研制火器的需求，这还远远不够。朝廷还在继续寻求钢铁的来源，这会导致钢铁的价格上升。"
 LDH_ciallo_mng_event_insight_4_tt:0 "\n §G事件前瞻§! ：以武力清剿倭寇，再以规模庞大的舰队保护我们的东南沿海，寇患可永绝矣。"
 LDH_ciallo_mng_event_insight_5_tt:0 "\n §G事件前瞻§! ：与佛郎机人的交流让我们接触到了一些闻所未闻的事物。"
 LDH_ciallo_mng_event_insight_6_tt:0 "\n §G事件前瞻§! ：台湾岛高山林立、瘴气横行，野蛮土人窜行期间。我们的开拓者设法在岛屿南部找到了一处平地，却意外发现了大量的陶土。"
 LDH_ciallo_mng_event_insight_7_tt:0 "\n §G事件前瞻§! ：这个事件宣告了海上丝绸之路在南洋的建立。"
 
 #modifier
 LDH_ciallo_mng_modifier_1_tt:0 "\n [1821.GetName] 的龙江造船厂和 [669.GetName] 的长乐造船厂曾负责制造郑和的宝船舰队。随着海禁政策的收紧，这两座造船厂逐渐被关停。现在，为了大明的海洋事业，我们将重启这两座造船厂。"
 LDH_ciallo_mng_modifier_2_tt:0 "\n 如果我们完成任务时至少拥有50000的水手上限，我们还将获得如下奖励："
 LDH_ciallo_mng_modifier_3_tt:0 "\n 如果完成任务时，我们在马六甲海峡拥有最强的贸易竞争力，我们还将获得如下修正："
 LDH_ciallo_mng_modifier_4_tt:0 "\n 如果我们完成任务时已启用进攻理念，我们将获得："
 LDH_ciallo_mng_modifier_5_tt:0 "\n 如果我们在完成任务时已启用防守理念，我们将获得："
 LDH_ciallo_mng_modifier_6_tt:0 "\n 如果我们以建造60艘宝船巨舰为完成任务的方式，我们将获得："
 LDH_ciallo_mng_modifier_7_tt:0 "\n 如果我们以建造120艘蒙冲快艇为完成任务的方式，我们将获得："
 LDH_ciallo_mng_modifier_8_tt:0 "\n 如果我们与任何首都位于[1020.GetName]的国家拥有150点好感度，我们将获得："
 LDH_ciallo_mng_modifier_9_tt:0 "\n 或者，如果我们对任何首都位于[1020.GetName]的国家进行了外交侮辱，我们将获得："
 LDH_ciallo_mng_modifier_10_tt:0 "\n 佛郎机人据屯门岛以劫掠我广州沿岸，提督汪鋐已领命荡寇，获得："
 LDH_ciallo_mng_modifier_11_tt:0 "\n 皇帝对西洋人的知识很感兴趣，恩准这些西洋人暂时驻留在澳门，以同我们进行交流往来，获得："
 LDH_ciallo_mng_modifier_12_tt:0 "\n 如果完成任务时，没有任何欧洲国家的收入比我们更高，我们还将获得："
 
 #hidden effect
 LDH_ciallo_mng_hidden_1_tt:0 "\n 我们治下每一个修建有造船厂或大船厂的省份都将获得殖民主义思潮进度 §G＋100§! ，同时还将获得本地造船花费减免，这一修正是永久的。"

