l_english:
 tengwangge_building:0 "滕王阁"
 tengwangge_building_desc:0 "滕王阁，乃洪州之名胜也。高临赣水，势压江城。雕梁画栋，云霞共色；飞阁流丹，耀目生辉。四时之景不同，春花烂漫，夏风清凉，秋月澄澈，冬雪皑皑。阁虽屡毁屡建，然雄姿不减，为江南名楼之翘楚，实为人文胜境也。\n\n    “————襟三江而带五湖，控蛮荆而引瓯越。”"
 bouxcuengh_palace:0 "壮族土司府"
 bouxcuengh_palace_building_tt:0 "远胜登仙去，飞鸾不假骖。"
 wudang_mountain:0 "武当山"
 wudang_mountain_desc:0 "武当山者，乃天下之胜境也。其峰峦奇秀，林壑幽深，七十二峰朝大顶，二十四涧水长流。更兼道教圣地，真武飞升于此，宫观林立，金殿辉煌。道家仙风弥漫，武术精妙绝伦，真可谓人间仙境，道韵悠长，令人心驰神往矣。\n\n    “————且乘金顶凉宵月，来避尘寰酷暑风。”"
 yungang_grottoes:0 "云冈石窟"
 yungang_grottoes_desc:0 "平城之侧，有云冈石窟，乃北魏宏构。峰峦之间，窟龛星罗，佛像万千。或庄严肃穆，法相慈悲；或身姿矫健，衣带飘举。雕工之精，鬼斧神工，将佛法妙相凝于石间。观者无不叹其宏大庄严，实乃佛门之瑰宝，震古烁今，令后世瞻拜。\n\n    “————片石三千界，微尘四部洲。”"
 tongguan_fortress_monument:0 "潼关"
 tongguan_fortress_monument_desc:0 "雄踞秦晋豫之要冲，为天下之襟喉。南依秦岭，峰峦嵯峨；北濒黄河，波涛汹涌。关城巍峨，固若金汤。古往今来，兵家必争，见证无数征伐，其险要之势，护佑关中安宁，青史留名，震慑四方。\n\n    “————峰峦如聚，波涛如怒，山河表里潼关路。”"
 nurgan_commission:0 "奴儿干都司"
 summer_palace:0 "圆明园"
 yaunmingyuan_poem_building_tt:0 "前夜残梦，只是今日的游戏。"
 potala_palace_tt:0 "竺法渐传三界远，盛音近绕佛堂前。"
 kangrinboqe:0 "冈仁波齐"
 kangrinboqe_desc:0 "冈仁波齐在藏语中意为'神灵之山'，西藏最古老的佛法古象雄佛法——雍仲苯教便发源于此。这座冈底斯圣山是八千万世界之中西方的俄摩隆仁或西方极乐世界之地，曾诞生八千万贤能并由此传播佛法，是古象雄文明的发祥地，是赡部洲的中心，也是神山之王。"
 karez:0 "坎儿井"
 karez_desc:0 "凿于地下，暗渠纵横，引天山之雪水，润绿洲之沃壤。其工程浩繁，匠人智慧，穿沙石，越丘壑，泉流不竭。火州万物，赖此井而生也，稻麦丰稔，瓜果飘香。古来西域商旅，亦借此井水，解渴消乏。虽无江河之壮阔，却润泽千里，滋养生民，实乃西域之奇构也。"
 quanzhou_shipping_bureau:0 "泉州市舶司"
 quanzhou_shipping_bureau_desc:0 "市舶者，处刺桐之要津，为海贸之重地也。扼控江海之咽喉，掌管万海之商贸，征税榷利，稽查违禁，以通货殖，利国利民。时万国帆影，帆樯如林，百货山积，胡商云集，珍奇毕至，实为东南经济之重器也。"

 Mount_Saint_Michel:0 "圣米歇尔山"
 Mount_Saint_Michel_desc:0 "它将大自然的巧夺天工与人类的智慧、毅力系于一身。傲然挺立，凭海临风。一千年来，大西洋的季风裹挟着流沙冲向圣马洛海湾，又带走了圣弥额尔山的美景，秘密和尸骨；任由这一切发生的，唯有沉默的时间，和山顶的光芒。\n\n §g    “————若陷于流沙之中，一定会遭到惊心动魄的埋葬，这个过程是漫长的、必然的、毫不容情的……”§! "
 Colosseum:0 "罗马斗兽场"
 Colosseum_desc:0 "曾几何时，雄狮的咆哮与角斗士的嘶吼震彻云霄，而今只剩风穿过拱券的呜咽。斑驳的大理石和裂缝，也曾是昔日帝国的荣光。夕阳为残破的轮廓镀上金边，在这座古老的竞技场中，曾经的辉煌与悲剧交织成一幅永恒的画卷。\n\n§g    “————伟大与毁灭，本就是一枚硬币的两面。”§! "
 Palace_of_Westminster:0 "议会大厦"
 Palace_of_Westminster_desc:0 "威斯特敏斯特宫的尖拱窗棂间，流淌着议会政治的千年回响，见证着民主的起伏与重生。这里是西式民主的摇篮，下院辩论的余音仍在橡木长桌间震颤，见证着资产阶级从新兴力量到掌权者的蜕变。​石墙上的斑驳，是政治制度改革的年轮。从《大宪章》到普选权的扩展，每一道裂缝都嵌着权力博弈的故事。"
 Catedral_de_Sevilla:0 "塞维利亚大教堂"
 Catedral_de_Sevilla_desc:0 "1248年，“圣者”费尔南多三世在“光复战争”中收回了塞维利亚，赶走了摩尔人。光复后的塞维利亚，需要一座大教堂，于是原来的清真寺就被用作天主教堂。1381年，不耐烦使用清真寺作教堂的塞维利亚人，决定拆除清真寺，在原址上建造“希拉尔达大教堂”，即塞维利亚大教堂。在将近300年时间里，它是基督教世界里最大的宗教建筑，是穆瓦希德文明和安达卢西亚基督教文明的非同寻常的见证，与梵蒂冈圣彼得大教堂、伦敦圣保罗大教堂并称为世界三大教堂。"
 Ben_Youssef_Madrasa:0 "优素福神学院"
 Ben_Youssef_Madrasa_desc:0 "摩洛哥的辉煌在雪松木雕间流转，这里是知识与虔诚的圣殿。以泽利杰马赛克铺就的信仰之路，将马拉喀什的智慧，撒播到整个穆斯林世界。\n\n§g    “————进入吾门者，愿你不断超越自我。”§! "
 Kasbah:0 "卡斯巴哈"
 University_of_Gottingen:0 "哥廷根大学"
 University_of_Gottingen_desc:0 "1734年，英国国王兼汉诺威大公乔治二世委派冯・明希豪森创办哥廷根大学，旨在弘扬启蒙时代学术自由的理念。彼时正值启蒙运动的浪潮席卷欧洲。在学术传统与社会思潮的双重影响下，哥廷根大学从建立之初，就深深烙印着对知识的无畏探索、对学术自由的执着追求。这所大学不仅是知识的殿堂，更是德国人严谨、创新学术精神的生动体现，见证了近现代人文社科与自然科学领域无数辉煌成就的诞生。\n\n§g    “————浅薄的学识使人远离神，广博的学识使人接近神。”§! "
 Drottningholm_Palace:0 "卓宁霍姆宫"
 increasing_Reformist_personality_tt:0 "君主有更大的几率出现 §Y能工巧匠§! 特质"
 increasing_Architectural_Visionary_personality_tt:0 "君主有更大的几率出现 §Y改革家§! 特质"
 increasing_strict_personality_tt:0 "君主有更大的几率出现 §Y治军严明§! 特质"
 Birka_Hovgarden:0 "比尔卡-霍夫加登"
 Budai_Var:0 "布达城堡山"
 Budai_Var_desc:0 "城堡山始建于13世纪，来自乌拉尔山的马扎尔族人经过几百年的游牧迁移，终于在公元896年定居在匈牙利这块土地上。最初的王宫本来建在布达佩斯以北险峻的维舍格拉德的高山顶上。鞑靼人入侵之乱结束以后，国王贝拉四世于1247年决定在城堡山修建城堡，先后用了几十年时间才使它初具规模，这就是最早的布达佩斯。14～15世纪是城堡山的全盛时期，这个当时被称作“布达”的山城成为匈牙利的政治、经济和文化的中心。"
 Sevastopol:0 "塞瓦斯托波尔"
 Sevastopol_desc:0 "千万的人类自尊心在这里互相冲撞，或在死亡中寂灭……\n\n……因为人是那么多，故虚荣亦是那么多……虚荣，虚荣，到处是虚荣，即是在墓门前面！这是我们这世纪的特殊箔…为何荷马与莎士比亚时之辈谈着爱、光荣与痛苦，而我们这世纪的文学只是虚荣者和趋崇时尚之徒的无穷尽的故事呢？"
 Vallee_de_Joux:0 "汝拉山谷"
 Vallee_de_Joux_desc:0 "绵延的侏罗山脉、葱郁的古老树林、闪亮的三面湖泊、散布的村镇农庄–在这里俯瞰到的，是瑞士最美丽的自然风光。汝拉山谷是一个充满活力的地方，拥有厚重的历史和人文气息。这里的居民以其精湛的手工艺和传统的生活方式而闻名，尤其是在钟表制造业方面。汝拉山谷不仅是自然爱好者的天堂，也是瑞士人坚韧不拔的精神和复杂繁密的钟表的代名词。"

 Royal_Hill_of_Ambohimanga:0 "皇家蓝山行宫"
 Mausoleum_of_Askia:0 "阿斯基亚王陵"
 Mausoleum_of_Askia_desc:0 "阿斯基亚王陵见证了桑海帝国在 15 至 16 世纪的强大、富裕和繁荣，它不仅是统治者的安息之所，更是非洲文明的瑰宝。石砌的墙壁上镌刻着古老的符号，见证着一个帝国的兴衰与荣耀。\n\n §g    “————在这片土地上，历史与传说交织，永恒与瞬间共存。”§! "
 Ribeira_Grande:0 "大里贝拉"
 Ribeira_Grande_desc:0 "大里贝拉，这颗由葡萄牙人在西非播下的明珠，是热带土地上扎下的第一根文明之锚！这片土地草木丰茂，阳光明媚，简直是上帝为航海家们预备的绝佳港湾————但凡穿越大西洋的船只，哪有不在此歇脚补给的道理？说它是连接各大洲的十字路口，真是再恰当不过。​那些从几内亚海湾沿岸带来的土著，在这儿接受我们的“教化”，恢复体力；才能被我们的船只送往里约热内卢、古巴、里士满的种植园，去为新世界的繁荣效力。​"
 Lamu_Old_Town:0 "拉穆古镇"
 Loro_Pani:0 "洛罗帕尼"
 Agadez_Trans_Saharan_Trading_Town:0 "阿加德兹绿洲"
 Agadez_Trans_Saharan_Trading_Town_desc:0 "阿加德兹位于撒哈拉沙漠南端，建立于15和16世纪阿伊尔苏丹国以及图阿雷格部落定居于此的时期。从15世纪开始，阿加德兹成为商队贸易的一个特殊十字路口，它从一个小城镇逐步成长为跨撒哈拉文化，贸易的重要据点，被时人称为“通往沙漠的门户”。"
 Fort_Jesus:0 "耶稣堡"
 Fort_Jesus:0 "耶稣堡由乔瓦尼·巴蒂斯塔·凯拉迪（Giovanni Battista Cairati） 设计，是16世纪葡萄牙军事要塞建筑中最出色的作品之一，建于1593年至1596年间。堡垒的设计灵感来自于耶稣基督的形象，堡垒的外形呈现出一个巨大的十字架。小岛四周水深浪静，自古为天然良港，是肯尼亚、乃至东非广大腹地通往世界各地的门户。也正因为如此，这里一直是阿拉伯人、土耳其人、葡萄牙人和英国人竞相争夺的交通要冲。"
 Mapungubwe:0 "马蓬古布韦"