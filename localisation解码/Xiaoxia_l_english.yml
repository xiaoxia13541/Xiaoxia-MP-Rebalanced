 fortress_fortification:0 "加强边防"
 fortress_fortification_desc:0 "\n只需要一点点小钱打发那些贱民，我们可以极大地加固我们的城墙，增厚墙体、增设箭楼与垛口，挖掘护城河提升防御能力；增强城池险要，以逸待劳，给来犯之敌予以迎头痛击。"
 weisuo_fortifed_the_border:0 "强化防御"
 desc_weisuo_fortifed_the_border:0 "最近的政策要求加强此处的防御工事"
 FORTRESS_FORTIFICATION_POLICY:0 "加强边防政策"
