 ability_chinese_weisuo_system:0 "五军都督府"
 prisoner_military_service:0 "囚犯充军"
 prisoner_military_service_desc:0 "在这个动荡不安的年代，法网无情地将一些人捕获，囚犯充军成为了一种常见的惩罚方式。他们被铁链锁住双手，被押送至遥远的边疆。在荒芜之地面对未知的艰难岁月，在战场上拼杀，在苦役中挣扎，生命如同风中残烛，而他们的故事，也在这残酷的现实中逐渐被遗忘。"
 prisoner_military_service_modifier:0 "鱼龙混杂的军队"
 desc_prisoner_military_service_modifier:0 "一些囚犯的参军使得我们的军队战斗力出现了暂时地下降"
 PRISONER_INTO_ARMY_POLICY:0 "囚犯充军政策"
 army_deving_border:0 "戍卒垦边"
 army_deving_border_desc:0 "命令驻守在当地的士兵们驱逐流民，开垦土地；只要我们运作得当，通过合适的宣传，一部分居民将会离开城市，'自愿'迁徙到此处定居。此举既解决军粮供应问题，又开发了荒芜之地，不失为一条妙计。 \n  "
 random_10_dev_prov_will_be_deved_tt:0 "\n选择一个总发展度低于 §Y10§! 的治下省份，提升该省 §Y1§! 点基础人力 ，并获得为期 §Y五年§! 的修正：\n本地发展成本：§G-10%§! \n本地税收修正：§R-30%§!"
 ARMY_DEVING_BORDER_POLICY:0 "戍卒垦边政策"
 foffy_china.EVTNAME8:0 "戍卒垦边"
 foffy_china.EVTDESC8:0 "命令驻守在当地的士兵们进行垦边，驱逐流民，国内有一些居民会'自愿'迁移到此处。此举既解决军粮供应问题，又开发了荒芜之地，不失为一条妙计。"
