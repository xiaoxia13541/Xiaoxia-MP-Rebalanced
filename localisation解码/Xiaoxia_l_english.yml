 benin_jungle_assembled_power_desc:1 "丛林动员值是衡量我们国家对于从林酋长的动员能力，其提供的修正将会随该数值进行线性变化。\n丛林动员值的月度变化因素如下：\n处于战时： §R-0.50§!\n处于和平： §R-1.00§!\n破产：§R-2.00§!\n每点腐败： §R-0.01§! \n丛林动员值可以通过提高威望，正统性，力量投射来获取。\n\n丛林动员值将因下列因素发生一次性变化：\n赢得一场战斗： §G+2.00§!\n赢得一场战争（与战争盟主和谈）： §G+15.00§!\n在战争条约中羞辱了宿敌： §G+30.00§!"
